<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Canvas Assignment</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #202124; }
    main { max-width: 520px; padding: 28px; text-align: center; }
    a { display: inline-block; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <p id="status">Opening Canvas…</p>
    <a id="fallback" href="#">Open Canvas in browser</a>
  </main>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const domain = params.get('domain') || 'peddie.instructure.com';
  const course = params.get('course');
  const assignment = params.get('assignment');

  if (!/^\d+$/.test(course || '') || !/^\d+$/.test(assignment || '')) {
    document.getElementById('status').textContent = 'Invalid Canvas assignment link.';
    document.getElementById('fallback').style.display = 'none';
    return;
  }

  const webUrl = `https://${domain}/courses/${course}/assignments/${assignment}`;
  const appUrl = `canvas-courses://${domain}/courses/${course}/assignments/${assignment}`;
  const fallback = document.getElementById('fallback');
  fallback.href = webUrl;

  // Detect iPhone/iPad, including iPads that identify as "Macintosh" in Safari.
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  if (!isIOS) {
    // Mac/desktop: use the normal Canvas web page for now.
    window.location.replace(webUrl);
    return;
  }

  // iPhone/iPad: try Canvas Student first. If the app is unavailable,
  // fall back to the normal Canvas website.
  let fallbackTimer = null;
  const cancelFallback = () => {
    if (fallbackTimer !== null) {
      clearTimeout(fallbackTimer);
      fallbackTimer = null;
    }
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelFallback();
  });
  window.addEventListener('pagehide', cancelFallback);

  fallbackTimer = setTimeout(() => {
    window.location.replace(webUrl);
  }, 1600);

  window.location.href = appUrl;
})();
</script>
</body>
</html>
