<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Open Canvas Assignment</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#f6f7f9; color:#202124; }
    main { max-width:520px; padding:28px; text-align:center; }
    a { display:inline-block; margin-top:12px; }
  </style>
</head>
<body>
<main>
  <p id="status">Opening Canvas…</p>
  <a id="fallback" href="#">Open Canvas in browser</a>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const domain = p.get("domain") || "peddie.instructure.com";
  const course = p.get("course");
  const assignment = p.get("assignment");
  const status = document.getElementById("status");
  const fallback = document.getElementById("fallback");

  if (!/^\d+$/.test(course || "") || !/^\d+$/.test(assignment || "")) {
    status.textContent = "Invalid Canvas assignment link.";
    fallback.style.display = "none";
    return;
  }

  const webUrl = `https://${domain}/courses/${course}/assignments/${assignment}`;
  const iosUrl = `canvas-courses://${domain}/courses/${course}/assignments/${assignment}`;
  fallback.href = webUrl;

  const ua = navigator.userAgent || "";
  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  if (isIOS) {
    // Keep the working iPhone/iPad Canvas Student deep link.
    // No automatic web fallback, to avoid leaving a Canvas login page behind.
    location.href = iosUrl;
    setTimeout(() => {
      if (!document.hidden) status.textContent = "Canvas did not open?";
    }, 1800);
  } else {
    // Mac and every other desktop: just open the normal Canvas assignment URL.
    location.replace(webUrl);
  }
})();
</script>
</body>
</html>
